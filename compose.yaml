# docker compose up --build
# Без .env поднимается локальный демо-стенд на http://localhost:3000/miniapp/.
# BOT_ENABLED=0 по умолчанию: второй экземпляр с тем же токеном отбирал бы апдейты у рабочего стенда.
services:
  app:
    build: .
    container_name: max-zhkh
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_BOT_USERNAME: ${MAX_BOT_USERNAME:-}
      BOT_ENABLED: ${BOT_ENABLED:-0}
      AUTH_DEV: ${AUTH_DEV:-1}
      INITDATA_TTL: ${INITDATA_TTL:-3600}
      TEST_API_KEY: ${TEST_API_KEY:-local-test-key}
      STAFF_CODES: ${STAFF_CODES:-uk-umny-dom:local-umny,uk-uyutny-dom:local-uyut,uk-sev-stolica:local-sev,tsj-lenskaya-8:local-lensk}
      DISPATCHER_IDS: ${DISPATCHER_IDS:-}
      DEMO_MODE: ${DEMO_MODE:-1}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_VISION_MODEL: ${GIGACHAT_VISION_MODEL:-GigaChat-2-Max}
      DADATA_TOKEN: ${DADATA_TOKEN:-}
    volumes:
      - dom-data:/app/data        # база переживает пересоздание контейнера (docker compose down -v сбрасывает её)
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  dom-data:
